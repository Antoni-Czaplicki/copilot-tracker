name: Build extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The extension bundles @copilot-tracker/shared; build it first so esbuild
      # and tsc can resolve its declaration files and CommonJS output.
      - name: Build shared package
        run: pnpm --filter @copilot-tracker/shared build

      - name: Compile extension
        run: pnpm --filter copilot-tracker compile

      - name: Resolve VSIX metadata
        id: vsix
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const manifest = require("./apps/extension/package.json");
          const name = String(manifest.name);
          const version = String(manifest.version);
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          console.log(`path=apps/extension/${name}-${version}.vsix`);
          NODE

      - name: Package VSIX
        run: pnpm package:extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix.outputs.name }}-${{ steps.vsix.outputs.version }}-vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error

      # On a version tag, attach the VSIX to a GitHub Release and, if a
      # marketplace token is configured, publish it.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true

      # Marketplace publishing is intentionally disabled for now. To enable it,
      # add a VSCE_PAT repository secret and uncomment the step below; it then
      # runs on version tags only.
      # - name: Publish to VS Code Marketplace
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   working-directory: apps/extension
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: pnpm exec vsce publish --no-dependencies --packagePath ../../${{ steps.vsix.outputs.path }}
